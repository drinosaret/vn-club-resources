<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ニュース検索 | Example</title>
<meta property="og:image" content="https://www.gamer.ne.jp/img/logo.jpg">
</head>
<body class="p-newslist">
<div class="l-container">
<main class="l-main">
  <section class="l-section">
    <div class="c-news-list">
      <div class="c-news-list__item c-news-list__item">
        <div class="c-news-list__text">
          <h3 class="c-news-list__title"><a href="/news/202609050010/">美少女ゲーム『架空の庭』の発売日が決定 &amp; 予約開始</a></h3>
          <div class="c-news-meta">
            <div class="c-news-date"><time>2026.09.05 14:00</time></div>
          </div>
        </div>
        <div class="c-news-list__image">
          <a href="/news/202609050010/" class="c-news-list__image-link"><img src="https://image.example.test/news/2026/20260905/0010/x/i.jpg" alt="架空の庭" width="480" height="300"></a>
          <a href="/news/pc/" class="c-news-cat c-news-cat--theme">PC</a>
        </div>
      </div>

      <div class="c-news-list__item c-news-list__item">
        <div class="c-news-list__text">
          <h3 class="c-news-list__title"><a href="/news/202609040020/">ノベルゲーム『遠い灯り』の体験版が配信開始</a></h3>
          <div class="c-news-meta">
            <div class="c-news-date"><time>2026.09.04 11:30</time></div>
          </div>
        </div>
        <div class="c-news-list__image">
        </div>
      </div>

      <div class="c-news-list__item c-news-list__item">
        <div class="c-news-list__text">
          <h3 class="c-news-list__title"><a href="/news/202508080023/">ビジュアルノベル配信サービスが終了へ</a></h3>
          <div class="c-news-meta">
            <div class="c-news-date"><time>2025.08.08 14:34</time></div>
          </div>
        </div>
        <div class="c-news-list__image">
          <a href="/news/202508080023/" class="c-news-list__image-link"><img src="https://image.example.test/news/2025/20250808/0023/x/i.jpg" alt="終了" width="480" height="300"></a>
          <a href="/news/game-industry/" class="c-news-cat c-news-cat--theme">ゲーム業界動向</a>
        </div>
      </div>
    </div>
  </section>
</main>
</div>
</body>
</html>
