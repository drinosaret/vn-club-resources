name: Security Scan

# Dependency vulnerability scanning for both halves of the stack.
# Separate from the deploy workflow, so a finding surfaces as a failed check
# without blocking deploys. Triage real findings; for an accepted advisory add
# `--ignore-vuln <ID>` (pip-audit) or remove the offending dep (npm).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-deps:
    name: Backend dependencies (pip-audit)
    # Skip on PRs: resolving/installing deps could execute fork-modified package code.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Audit Python dependencies
        run: |
          python3 -m venv /tmp/audit
          /tmp/audit/bin/pip install --quiet --upgrade pip uv pip-audit
          # Resolve the floor-only requirements to pinned versions (metadata only,
          # no wheel builds), then audit. VCS deps (tweety-ns) aren't on PyPI and
          # are already commit-pinned, so drop them before auditing.
          /tmp/audit/bin/uv pip compile vndb-stats-backend/requirements.txt -o /tmp/requirements.lock
          grep -v 'git+' /tmp/requirements.lock > /tmp/requirements.audit.txt || true
          /tmp/audit/bin/pip-audit -r /tmp/requirements.audit.txt

  backend-tests:
    name: Backend tests (pytest)
    # Runs the vndb-stats-backend suite. Not listed in deploy-vps.yml's
    # REQUIRED array yet: add it there once it has been observed green, so a
    # pre-existing failure can't block deploys the moment this lands.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: vndb-stats-backend
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements-dev.txt
      - name: Run tests
        working-directory: vndb-stats-backend
        run: python -m pytest tests/ -q

  frontend-deps:
    name: Frontend dependencies (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Runtime deps only. npm has no per-advisory ignore, so one unfixable
      # build-tool advisory would block deploys indefinitely. Dependabot still
      # reports dev-dependency findings.
      - name: Audit npm dependencies
        run: npm audit --audit-level=high --omit=dev
