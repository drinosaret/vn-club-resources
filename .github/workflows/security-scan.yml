name: Security Scan

# Dependency vulnerability scanning for both halves of the stack.
# Separate from the deploy workflow, so a finding surfaces as a failed check
# without blocking deploys. Triage real findings; for an accepted advisory add
# `--ignore-vuln <ID>` (pip-audit) or remove the offending dep (npm).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-deps:
    name: Backend dependencies (pip-audit)
    # Skip on PRs: resolving/installing deps could execute fork-modified package code.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check the lock covers requirements.txt
        # A dependency added to requirements.txt without regenerating the lock
        # would never be installed, since the image builds from the lock.
        run: python3 .github/scripts/check_lock_coverage.py
      - name: Audit Python dependencies
        # Audits the committed lock, which is what the image installs. Auditing a
        # fresh resolution instead would report on versions that never ship.
        # requirements-vcs.txt is excluded: it isn't on PyPI and is commit-pinned.
        run: |
          python3 -m venv /tmp/audit
          /tmp/audit/bin/pip install --quiet --upgrade pip pip-audit
          /tmp/audit/bin/pip-audit -r vndb-stats-backend/requirements.lock

  backend-tests:
    name: Backend tests (pytest)
    # Runs the vndb-stats-backend suite. Listed in deploy-vps.yml's REQUIRED
    # array, so a failure here holds the deploy. Keep the job name in sync with
    # that entry.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: vndb-stats-backend
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements-dev.txt
      - name: Run tests
        working-directory: vndb-stats-backend
        run: python -m pytest tests/ -q

  frontend-deps:
    name: Frontend dependencies (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Runtime deps only. npm has no per-advisory ignore, so one unfixable
      # build-tool advisory would block deploys indefinitely. Dependabot still
      # reports dev-dependency findings.
      - name: Audit npm dependencies
        run: npm audit --audit-level=high --omit=dev
